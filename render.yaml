services:
  - type: web
    name: newsbot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: PORT
        value: "10000"
      - key: CHANNEL_NAME
        sync: false             # Set in Render dashboard
      - key: GEMINI_API_KEY
        sync: false             # Set in Render dashboard
      - key: TTS_ENGINE
        value: gtts
      - key: VOICE_LANGUAGE
        value: en
      - key: USE_LOCAL_ML
        value: "false"
      - key: VIDEO_RESOLUTION
        value: "1280x720"
      - key: SCRAPE_INTERVAL_MINUTES
        value: "30"
      - key: MAX_ARTICLES_PER_RUN
        value: "3"
      - key: OUTPUT_DIR
        value: /tmp/output
      - key: LOG_DIR
        value: /tmp/logs
